version: '3.8'

services:
  openhands:
    image: ghcr.io/openhands/agent-canvas:latest
    container_name: openhands-app
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - openhands-data:/home/openhands/.openhands
      - ./:/workspace
      - "/mnt/c/GITHUB CONTRIBUTION DONT TOUCH/awesome-ai-apps:/awesome-ai-apps"
      - "/mnt/c/Sachit/Creator Desk:/creator-desk"
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=docker.openhands.dev/openhands/runtime:0.60-nikolaik
      - LOG_ALL_EVENTS=true
      - SANDBOX_USE_HOST_NETWORK=true
      - AGENT_CANVAS_API_KEY=my-super-secret-key
      - LOCAL_BACKEND_API_KEY=my-super-secret-key
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  openhands-data: