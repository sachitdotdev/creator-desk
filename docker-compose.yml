version: '3.8'

services:
  openhands:
    image: docker.openhands.dev/openhands/openhands:0.60
    container_name: openhands-app
    ports:
      - "3000:3000"
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
      - openhands-data:/home/openhands/.openhands
      # THIS is the magic line that mounts your Creator Desk folder!
      - ./:/workspace
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=docker.openhands.dev/openhands/runtime:0.60-nikolaik
      - LOG_ALL_EVENTS=true
      - SANDBOX_USE_HOST_NETWORK=true
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  openhands-data: